<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Do you love me?</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page page-home">
      <section class="love-card">
        <h1 class="question">Do you love me?</h1>

        <div class="image-frame" id="imageFrame">
          <img
            src="https://i.pinimg.com/736x/ed/b1/48/edb1486ee7b61af98d8dbfe39b163d93.jpg"
            alt="Foto de amor"
            class="fixed-photo"
          />
        </div>

        <div class="buttons-row">
          <button id="yesButton" class="btn btn-yes" type="button">YES</button>
          <button id="noButton" class="btn btn-no" type="button">NO</button>
        </div>
      </section>
    </main>

    <script src="script.js?v=2026-09-23-1"></script>
  </body>
</html>
